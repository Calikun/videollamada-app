<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ensigna.corp — Acceso Administrativo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#e2e8f0}
    .card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:48px 40px;width:92%;max-width:420px;text-align:center}
    .logo{width:48px;height:48px;margin:0 auto 16px}
    .logo img{width:100%;height:100%;object-fit:contain;border-radius:12px}
    h1{font-size:1.5rem;font-weight:700;color:#f1f5f9;margin-bottom:4px}
    .sub{color:#64748b;font-size:.85rem;margin-bottom:32px}
    .field{margin-bottom:20px;text-align:left}
    .field label{display:block;font-size:.75rem;color:#94a3b8;margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
    .field input{width:100%;padding:12px 16px;background:#0f172a;border:1.5px solid #334155;border-radius:10px;color:#f1f5f9;font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s}
    .field input:focus{border-color:#3b82f6}
    .btn{width:100%;padding:13px;background:#3b82f6;border:none;border-radius:10px;color:#fff;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s}
    .btn:hover{background:#2563eb}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .error{color:#ef4444;font-size:.8rem;margin-top:12px;display:none}
    .error.show{display:block}
    .back{margin-top:24px;font-size:.8rem;color:#64748b}
    .back a{color:#3b82f6;text-decoration:none}
    .back a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/static/logo.png" alt="Ensigna"></div>
    <h1>Ensigna.corp</h1>
    <div class="sub">Panel Administrativo</div>
    <form id="loginForm">
      <div class="field">
        <label for="user">Usuario</label>
        <input type="text" id="user" autocomplete="username" placeholder="admin" required>
      </div>
      <div class="field">
        <label for="pass">Contrasena</label>
        <input type="password" id="pass" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">Iniciar sesion</button>
      <div class="error" id="errMsg">Credenciales incorrectas</div>
    </form>
    <div class="back"><a href="/">Volver a la sala de reuniones</a></div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errMsg = document.getElementById('errMsg');
    const submitBtn = document.getElementById('submitBtn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errMsg.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            username: document.getElementById('user').value,
            password: document.getElementById('pass').value
          })
        });
        if (res.ok) {
          window.location.href = '/admin';
        } else {
          errMsg.classList.add('show');
        }
      } catch (err) {
        errMsg.textContent = 'Error de conexion';
        errMsg.classList.add('show');
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Iniciar sesion';
    });
  </script>
</body>
</html>
