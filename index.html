<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VideoCall — Plataforma de videollamadas profesional. Crea o únete a salas de reuniones seguras con video, audio y chat en tiempo real.">
  <title>VideoCall · Sala de reuniones profesional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(145deg, #0a0a10 0%, #12121a 50%, #0d0d1a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      overflow: hidden;
    }

    /* Animated background orbs */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      pointer-events: none;
      animation: float 12s ease-in-out infinite alternate;
    }

    body::before {
      width: 500px;
      height: 500px;
      background: #7c6ff7;
      top: -150px;
      right: -100px;
    }

    body::after {
      width: 400px;
      height: 400px;
      background: #4f46e5;
      bottom: -100px;
      left: -80px;
      animation-delay: -6s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.1); }
    }

    .lobby {
      background: rgba(18, 18, 26, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 48px 36px;
      width: 92%;
      max-width: 480px;
      text-align: center;
      border: 1px solid rgba(124, 111, 247, 0.2);
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.5),
        0 0 80px rgba(124, 111, 247, 0.06);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
      position: relative;
      z-index: 1;
    }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #7c6ff7, #4f46e5);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 20px;
      box-shadow: 0 8px 24px rgba(124, 111, 247, 0.3);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #a99ef7 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: #6b6b7b;
      font-size: 0.9rem;
      margin-bottom: 36px;
      font-weight: 400;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.78rem;
      color: #8a8a9a;
      margin-bottom: 8px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(28, 28, 38, 0.8);
      border: 1.5px solid rgba(42, 42, 53, 0.8);
      border-radius: 16px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
    }

    input::placeholder {
      color: #4a4a5a;
    }

    input:focus {
      border-color: #7c6ff7;
      box-shadow: 0 0 0 3px rgba(124, 111, 247, 0.15);
      background: rgba(28, 28, 38, 1);
    }

    input.error {
      border-color: #e53e3e;
      box-shadow: 0 0 0 3px rgba(229, 62, 62, 0.15);
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .error-msg {
      color: #e53e3e;
      font-size: 0.75rem;
      margin-top: 6px;
      display: none;
      font-weight: 500;
    }

    .error-msg.visible {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-primary {
      background: linear-gradient(135deg, #7c6ff7, #6359d1);
      border: none;
      padding: 15px 18px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      width: 100%;
      transition: all 0.25s ease;
      margin-top: 8px;
      font-family: inherit;
      letter-spacing: 0.01em;
      position: relative;
      overflow: hidden;
    }

    .btn-primary::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(124, 111, 247, 0.35);
    }

    .btn-primary:hover::after {
      opacity: 1;
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .info-text {
      font-size: 0.75rem;
      color: rgba(124, 111, 247, 0.7);
      margin-top: 28px;
      line-height: 1.5;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      color: #6b6b7b;
    }

    .feature-icon {
      font-size: 1.1rem;
      margin-bottom: 2px;
    }
  </style>
</head>

<body>
  <div class="lobby">
    <div class="logo-icon">📹</div>
    <h1>VideoCall</h1>
    <div class="subtitle">Reuniones profesionales en la nube</div>

    <div class="input-group">
      <label for="nameInput">Nombre completo</label>
      <input type="text" id="nameInput" placeholder="Ej: Ana García" maxlength="40" autocomplete="name">
      <div class="error-msg" id="nameError">Por favor ingresa tu nombre</div>
    </div>

    <div class="input-group">
      <label for="roleInput">Cargo / Rol</label>
      <input type="text" id="roleInput" placeholder="Ej: Directora de Proyectos" maxlength="40">
    </div>

    <div class="input-group">
      <label for="roomIdInput">ID de sala (opcional)</label>
      <input type="text" id="roomIdInput" placeholder="Dejar vacío para crear nueva sala">
    </div>

    <button class="btn-primary" id="joinBtn">Unirse o crear sala</button>

    <div class="features">
      <div class="feature">
        <span class="feature-icon">🔒</span>
        <span>Seguro</span>
      </div>
      <div class="feature">
        <span class="feature-icon">⚡</span>
        <span>Tiempo real</span>
      </div>
      <div class="feature">
        <span class="feature-icon">💬</span>
        <span>Chat</span>
      </div>
    </div>

    <div class="info-text">El primer participante será el anfitrión con control sobre la reunión.</div>
  </div>

  <script>
    const joinBtn = document.getElementById('joinBtn');
    const roomInput = document.getElementById('roomIdInput');
    const nameInput = document.getElementById('nameInput');
    const roleInput = document.getElementById('roleInput');
    const nameError = document.getElementById('nameError');

    // Focus name input on load
    nameInput.focus();

    // Clear error on input
    nameInput.addEventListener('input', () => {
      nameInput.classList.remove('error');
      nameError.classList.remove('visible');
    });

    function joinOrCreate() {
      const name = nameInput.value.trim();
      const role = roleInput.value.trim();

      // Validate name
      if (name === '') {
        nameInput.classList.add('error');
        nameError.classList.add('visible');
        nameInput.focus();
        return;
      }

      let roomId = roomInput.value.trim();
      if (roomId === '') {
        // Crear nueva sala con ID aleatorio
        roomId = Math.random().toString(36).substring(2, 10);
      }

      const params = new URLSearchParams();
      params.set('name', name);
      if (role) params.set('role', role);

      window.location.href = `/room/${encodeURIComponent(roomId)}?${params.toString()}`;
    }

    joinBtn.addEventListener('click', joinOrCreate);

    // Enter key on any input
    [nameInput, roleInput, roomInput].forEach(input => {
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') joinOrCreate();
      });
    });
  </script>
</body>

</html>
