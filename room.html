<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Sala de videollamada en tiempo real con video, audio y chat.">
    <title>VideoCall · Sala {{ROOM_ID}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a10;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            background: #18181f;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            background: #1c1c26;
            padding: 6px 16px;
            border-radius: 40px;
            font-family: monospace;
        }

        .copy-btn {
            background: #2a2a35;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
        }

        .participants-count {
            background: #1c1c26;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
        }

        .conn-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #8a8a98;
        }

        .conn-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f59e0b;
            transition: background 0.3s;
        }

        .conn-dot.connected {
            background: #22c55e;
            box-shadow: 0 0 8px rgba(34,197,94,0.4);
        }

        .conn-dot.error {
            background: #ef4444;
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .videos-area {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            padding: 20px;
            overflow-y: auto;
            background: #0f0f13;
        }

        .video-card {
            background: #1c1c26;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: cardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: border-color 0.3s;
        }

        .video-card:hover {
            border-color: rgba(124, 111, 247, 0.3);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .host-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(124, 111, 247, 0.8);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }

        .muted-badge {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
        }

        .host-action-btn {
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 16px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 4px;
        }

        .chat-panel {
            width: 280px;
            background: #18181f;
            border-left: 0.5px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .chat-header {
            padding: 16px;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-message .sender {
            font-weight: 600;
            color: #a99ef7;
            margin-right: 8px;
        }

        .chat-message.system {
            color: #8a8a98;
            font-style: italic;
            font-size: 12px;
            text-align: center;
        }

        .chat-input-area {
            padding: 16px;
            border-top: 0.5px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            background: #1c1c26;
            border: 1px solid #2a2a35;
            border-radius: 24px;
            padding: 10px 14px;
            color: #fff;
        }

        .chat-input-area button {
            background: #7c6ff7;
            border: none;
            border-radius: 24px;
            padding: 0 16px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .controls-bar {
            background: #18181f;
            padding: 12px 24px;
            display: flex;
            justify-content: center;
            gap: 16px;
            border-top: 0.5px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: #2a2a35;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn.primary {
            background: #7c6ff7;
        }

        .ctrl-btn.danger {
            background: #c23535;
        }

        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a2a35;
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 13px;
            animation: fadeOut 2.5s forwards;
            z-index: 1000;
            pointer-events: none;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }

        @media (max-width: 800px) {
            .chat-panel {
                width: 240px;
            }

            .videos-area {
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            }
        }

        @media (max-width: 600px) {
            .main-container {
                flex-direction: column;
            }

            .chat-panel {
                width: 100%;
                height: 240px;
                border-left: none;
                border-top: 0.5px solid rgba(255, 255, 255, 0.08);
            }

            .videos-area {
                order: 1;
            }

            .chat-panel {
                order: 2;
            }
        }

        /* ── Media Error Banner ── */
        .media-error-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(185, 28, 28, 0.95));
            backdrop-filter: blur(12px);
            color: white;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2000;
            font-size: 14px;
            animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .media-error-banner .error-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .media-error-banner .error-icon {
            font-size: 20px;
        }

        .media-error-banner .error-text strong {
            display: block;
            font-size: 14px;
        }

        .media-error-banner .error-text span {
            font-size: 12px;
            opacity: 0.9;
        }

        .media-error-banner .close-error {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .media-error-banner .close-error:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        .media-warning-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.95), rgba(180, 110, 0, 0.95));
            backdrop-filter: blur(12px);
            color: white;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2000;
            font-size: 14px;
            animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .media-warning-banner .error-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .media-warning-banner .error-icon { font-size: 20px; }
        .media-warning-banner .error-text strong { display: block; font-size: 14px; }
        .media-warning-banner .error-text span { font-size: 12px; opacity: 0.9; }

        .media-warning-banner .close-error {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <div class="room-info">
            <span>Sala</span>
            <strong id="roomIdDisplay">{{ROOM_ID}}</strong>
            <button class="copy-btn" id="copyBtn">Copiar ID</button>
        </div>
        <div class="conn-status" id="connStatus">
            <span class="conn-dot" id="connDot"></span>
            <span id="connText">Conectando...</span>
        </div>
        <div class="participants-count" id="participantsCount">Participantes: 1</div>
    </div>
    <div class="main-container">
        <div class="videos-area" id="videosGrid"></div>
        <div class="chat-panel">
            <div class="chat-header">Chat de la reunión</div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Escribe un mensaje...">
                <button id="sendChatBtn">Enviar</button>
            </div>
        </div>
    </div>
    <div class="controls-bar">
        <button class="ctrl-btn" id="micBtn">🎤</button>
        <button class="ctrl-btn" id="camBtn">📷</button>
        <button class="ctrl-btn primary" id="startCallBtn">📞</button>
        <button class="ctrl-btn danger" id="hangupBtn">❌</button>
    </div>

    <script>
        (function () {
            // ----- Configuración -----
            const roomId = '{{ROOM_ID}}';
            const urlParams = new URLSearchParams(window.location.search);
            let myName = urlParams.get('name') || 'Anónimo';
            let myRole = urlParams.get('role') || '';
            const myDisplay = myRole ? `${myName} (${myRole})` : myName;
            // Fix #4: Detect protocol dynamically
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const WS_URL = `${wsProtocol}//${window.location.host}/ws/${roomId}`;

            // ICE servers with TURN fallback
            const ICE_CONFIG = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            };

            // ----- Variables globales -----
            let socket = null;
            let localStream = null;
            let myUserId = null;
            let amIHost = false;
            let hostId = null;
            let callActive = false;
            let micEnabled = true;
            let camEnabled = true;
            let wsReconnectAttempts = 0;
            const MAX_RECONNECT = 5;

            // peers: map de userId -> { pc, display, isHost, muted, videoElement, pendingCandidates }
            let peers = new Map();
            // Fix #6: Known users list (stored before call starts)
            let knownUsers = new Map(); // userId -> { display, isHost, muted }

            // Elementos DOM
            const videosGrid = document.getElementById('videosGrid');
            const participantsSpan = document.getElementById('participantsCount');
            const chatMessagesDiv = document.getElementById('chatMessages');
            const connDot = document.getElementById('connDot');
            const connText = document.getElementById('connText');

            // ----- Funciones auxiliares -----
            function setConnectionStatus(status) {
                connDot.className = 'conn-dot';
                if (status === 'connected') {
                    connDot.classList.add('connected');
                    connText.textContent = 'Conectado';
                } else if (status === 'error') {
                    connDot.classList.add('error');
                    connText.textContent = 'Desconectado';
                } else {
                    connText.textContent = 'Conectando...';
                }
            }

            function showToast(msg) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerText = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2500);
            }

            // Fix #10: Always count current user as 1 participant
            function updateParticipantsCount() {
                const count = 1 + knownUsers.size;
                participantsSpan.innerText = `Participantes: ${count}`;
            }

            function addChatMessage(sender, message, isSystem = false) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'chat-message';
                if (isSystem) {
                    msgDiv.classList.add('system');
                    msgDiv.innerText = message;
                } else {
                    msgDiv.innerHTML = `<span class="sender">${escapeHtml(sender)}</span><span>${escapeHtml(message)}</span>`;
                }
                chatMessagesDiv.appendChild(msgDiv);
                msgDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function (m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            // Crear elemento de video en el grid
            function createVideoElement(userId, displayName, isLocal = false, isHost = false, isMuted = false) {
                const container = document.createElement('div');
                container.className = 'video-card';
                container.id = `video-${userId}`;
                const video = document.createElement('video');
                video.autoplay = true;
                video.playsInline = true;
                if (isLocal) video.muted = true;
                const label = document.createElement('div');
                label.className = 'video-label';
                label.innerText = isLocal ? `Tú (${displayName})` : displayName;
                container.appendChild(video);
                container.appendChild(label);
                if (isHost && !isLocal) {
                    const badge = document.createElement('div');
                    badge.className = 'host-badge';
                    badge.innerText = 'Anfitrión';
                    container.appendChild(badge);
                }
                if (isMuted && !isLocal) {
                    const badge = document.createElement('div');
                    badge.className = 'muted-badge';
                    badge.innerText = '🔇 Silenciado';
                    container.appendChild(badge);
                }
                // Si soy host y no es mi video, añadir botones de control
                if (amIHost && !isLocal) {
                    const controlsDiv = document.createElement('div');
                    controlsDiv.style.position = 'absolute';
                    controlsDiv.style.bottom = '12px';
                    controlsDiv.style.right = '12px';
                    controlsDiv.style.display = 'flex';
                    controlsDiv.style.gap = '6px';
                    const muteBtn = document.createElement('button');
                    muteBtn.className = 'host-action-btn';
                    muteBtn.setAttribute('data-action', 'mute');
                    muteBtn.innerText = isMuted ? '🔊 Activar' : '🔇 Silenciar';
                    muteBtn.onclick = (e) => {
                        e.stopPropagation();
                        socket.send(JSON.stringify({
                            type: 'host-mute',
                            targetId: userId,
                            mute: !isMuted
                        }));
                    };
                    const kickBtn = document.createElement('button');
                    kickBtn.className = 'host-action-btn';
                    kickBtn.innerText = '🚫 Expulsar';
                    kickBtn.onclick = (e) => {
                        e.stopPropagation();
                        if (confirm(`¿Expulsar a ${displayName}?`)) {
                            socket.send(JSON.stringify({
                                type: 'host-kick',
                                targetId: userId
                            }));
                        }
                    };
                    controlsDiv.appendChild(muteBtn);
                    controlsDiv.appendChild(kickBtn);
                    container.appendChild(controlsDiv);
                }
                videosGrid.appendChild(container);
                return { container, video };
            }

            function removeVideoElement(userId) {
                const el = document.getElementById(`video-${userId}`);
                if (el) el.remove();
            }

            // ----- WebRTC: Crear conexión con un peer remoto -----
            async function createPeerConnection(remoteUserId, remoteDisplay, isInitiator = true) {
                if (peers.has(remoteUserId)) {
                    console.log(`Peer ${remoteUserId} already exists`);
                    return peers.get(remoteUserId).pc;
                }
                console.log(`Creating peer connection for ${remoteUserId}, initiator=${isInitiator}`);
                const pc = new RTCPeerConnection(ICE_CONFIG);

                // Fix #12: Buffer for ICE candidates arriving before remote description
                const peerInfo = {
                    pc: pc,
                    display: remoteDisplay,
                    isHost: knownUsers.get(remoteUserId)?.isHost || false,
                    muted: knownUsers.get(remoteUserId)?.muted || false,
                    videoElement: null,
                    pendingCandidates: []
                };
                peers.set(remoteUserId, peerInfo);

                // Añadir tracks locales si ya tenemos stream
                if (localStream) {
                    localStream.getTracks().forEach(track => {
                        pc.addTrack(track, localStream);
                        console.log(`Added local track ${track.kind} to peer ${remoteUserId}`);
                    });
                }

                // Manejar tracks entrantes
                pc.ontrack = (event) => {
                    console.log(`Got remote track from ${remoteUserId}, kind=${event.track.kind}`);
                    let info = peers.get(remoteUserId);
                    if (!info) return;
                    if (!info.videoElement) {
                        const { video } = createVideoElement(remoteUserId, info.display, false, info.isHost, info.muted);
                        info.videoElement = video;
                    }
                    if (info.videoElement.srcObject !== event.streams[0]) {
                        info.videoElement.srcObject = event.streams[0];
                    }
                };

                // ICE candidates
                pc.onicecandidate = (event) => {
                    if (event.candidate && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({
                            type: 'candidate',
                            candidate: event.candidate,
                            target: remoteUserId
                        }));
                    }
                };

                pc.oniceconnectionstatechange = () => {
                    console.log(`ICE state for ${remoteUserId}: ${pc.iceConnectionState}`);
                    if (pc.iceConnectionState === 'failed') {
                        // Only clean up on failed, not disconnected (can recover)
                        if (peers.has(remoteUserId)) {
                            peers.get(remoteUserId).pc.close();
                            peers.delete(remoteUserId);
                            removeVideoElement(remoteUserId);
                            updateParticipantsCount();
                            showToast(`Conexión perdida con ${remoteDisplay}`);
                        }
                    }
                };

                // Si somos iniciadores con stream activo, crear y enviar oferta
                if (isInitiator && localStream) {
                    try {
                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        socket.send(JSON.stringify({
                            type: 'offer',
                            offer: offer,
                            target: remoteUserId
                        }));
                        console.log(`Sent offer to ${remoteUserId}`);
                    } catch (e) {
                        console.error(`Error creating offer for ${remoteUserId}`, e);
                    }
                }
                updateParticipantsCount();
                return pc;
            }

            // Fix #8: Auto-acquire media when receiving an offer if not active
            async function ensureLocalStream() {
                if (localStream) return true;
                try {
                    // Verificar compatibilidad del navegador
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        showMediaError(
                            'Navegador no compatible',
                            'Tu navegador no soporta videollamadas. Usa Chrome, Firefox, Safari o Edge actualizado.'
                        );
                        return false;
                    }
                    // Verificar HTTPS (requerido para getUserMedia en producción)
                    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                        showMediaWarning(
                            'Conexión no segura',
                            'La cámara y micrófono requieren HTTPS. Algunas funciones pueden no estar disponibles.'
                        );
                    }
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    const { video } = createVideoElement('local', myDisplay, true, amIHost, false);
                    video.srcObject = localStream;
                    callActive = true;
                    showToast('Cámara y micrófono activados automáticamente');
                    return true;
                } catch (err) {
                    console.error('Error auto-acquiring media', err);
                    // Intentar solo audio como fallback
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
                        const { video } = createVideoElement('local', myDisplay, true, amIHost, false);
                        video.srcObject = localStream;
                        callActive = true;
                        camEnabled = false;
                        document.getElementById('camBtn').style.opacity = '0.5';
                        showMediaWarning(
                            'Solo audio disponible',
                            'No se pudo acceder a la cámara, pero el micrófono está activo.'
                        );
                        return true;
                    } catch (audioErr) {
                        handleMediaError(err);
                        return false;
                    }
                }
            }

            // ── Manejo detallado de errores de medios ──
            function handleMediaError(err) {
                console.error('Media error details:', err.name, err.message);
                switch (err.name) {
                    case 'NotAllowedError':
                    case 'PermissionDeniedError':
                        showMediaError(
                            'Permisos denegados',
                            'Debes permitir el acceso a la cámara y micrófono. Haz clic en el ícono de candado en la barra de direcciones y activa los permisos.'
                        );
                        break;
                    case 'NotFoundError':
                    case 'DevicesNotFoundError':
                        showMediaError(
                            'Dispositivo no encontrado',
                            'No se encontró cámara ni micrófono. Verifica que estén conectados y no sean usados por otra aplicación.'
                        );
                        break;
                    case 'NotReadableError':
                    case 'TrackStartError':
                        showMediaError(
                            'Dispositivo ocupado',
                            'La cámara o micrófono están siendo usados por otra aplicación. Cierra otras apps y vuelve a intentar.'
                        );
                        break;
                    case 'OverconstrainedError':
                        showMediaError(
                            'Configuración no soportada',
                            'Tu cámara no soporta la configuración solicitada. Intenta con otro dispositivo.'
                        );
                        break;
                    case 'TypeError':
                        showMediaError(
                            'Error de configuración',
                            'Hay un problema con la configuración de medios. Recarga la página e intenta de nuevo.'
                        );
                        break;
                    default:
                        showMediaError(
                            'Error al acceder a dispositivos',
                            `No se pudo acceder a la cámara o micrófono: ${err.message || 'Error desconocido'}`
                        );
                }
            }

            function showMediaError(title, detail) {
                // Remove existing banners
                document.querySelectorAll('.media-error-banner, .media-warning-banner').forEach(b => b.remove());
                const banner = document.createElement('div');
                banner.className = 'media-error-banner';
                banner.innerHTML = `
                    <div class="error-content">
                        <span class="error-icon">🚫</span>
                        <div class="error-text">
                            <strong>${title}</strong>
                            <span>${detail}</span>
                        </div>
                    </div>
                    <button class="close-error" onclick="this.parentElement.remove()">Entendido</button>
                `;
                document.body.prepend(banner);
            }

            function showMediaWarning(title, detail) {
                document.querySelectorAll('.media-warning-banner').forEach(b => b.remove());
                const banner = document.createElement('div');
                banner.className = 'media-warning-banner';
                banner.innerHTML = `
                    <div class="error-content">
                        <span class="error-icon">⚠️</span>
                        <div class="error-text">
                            <strong>${title}</strong>
                            <span>${detail}</span>
                        </div>
                    </div>
                    <button class="close-error" onclick="this.parentElement.remove()">OK</button>
                `;
                document.body.prepend(banner);
                // Auto-dismiss warning after 8 seconds
                setTimeout(() => { if (banner.parentElement) banner.remove(); }, 8000);
            }

            // Fix #12: Flush buffered ICE candidates after remote description is set
            async function flushPendingCandidates(remoteUserId) {
                const peerInfo = peers.get(remoteUserId);
                if (!peerInfo || !peerInfo.pendingCandidates.length) return;
                console.log(`Flushing ${peerInfo.pendingCandidates.length} pending candidates for ${remoteUserId}`);
                for (const candidate of peerInfo.pendingCandidates) {
                    try {
                        await peerInfo.pc.addIceCandidate(new RTCIceCandidate(candidate));
                    } catch (e) {
                        console.error('Error adding buffered ICE candidate', e);
                    }
                }
                peerInfo.pendingCandidates = [];
            }

            // Manejar oferta entrante
            async function handleOffer(remoteUserId, offer, senderName) {
                console.log(`Received offer from ${remoteUserId}`);
                // Fix #8: Ensure we have local media before responding
                const hasMedia = await ensureLocalStream();

                let peerInfo = peers.get(remoteUserId);
                if (!peerInfo) {
                    await createPeerConnection(remoteUserId, senderName || `Usuario ${remoteUserId.substring(0, 6)}`, false);
                    peerInfo = peers.get(remoteUserId);
                }
                // If we just got media and PC has no tracks, add them
                if (hasMedia && localStream) {
                    const senders = peerInfo.pc.getSenders();
                    if (senders.length === 0) {
                        localStream.getTracks().forEach(track => {
                            peerInfo.pc.addTrack(track, localStream);
                        });
                    }
                }
                const pc = peerInfo.pc;
                try {
                    if (pc.signalingState === 'stable' || pc.signalingState === 'have-local-offer') {
                        // Handle glare: if both sides sent offers, the one with lower userId yields
                        if (pc.signalingState === 'have-local-offer') {
                            if (myUserId > remoteUserId) {
                                console.log('Glare detected, yielding as polite peer');
                                await pc.setLocalDescription({ type: 'rollback' });
                            } else {
                                console.log('Glare detected, ignoring offer as impolite peer');
                                return;
                            }
                        }
                        await pc.setRemoteDescription(new RTCSessionDescription(offer));
                        await flushPendingCandidates(remoteUserId);
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        socket.send(JSON.stringify({
                            type: 'answer',
                            answer: answer,
                            target: remoteUserId
                        }));
                        console.log(`Sent answer to ${remoteUserId}`);
                    } else {
                        console.warn(`Ignoring offer due to signaling state ${pc.signalingState}`);
                    }
                } catch (e) {
                    console.error(`Error handling offer from ${remoteUserId}`, e);
                }
            }

            // Manejar respuesta
            async function handleAnswer(remoteUserId, answer) {
                console.log(`Received answer from ${remoteUserId}`);
                const peerInfo = peers.get(remoteUserId);
                if (peerInfo && peerInfo.pc.signalingState === 'have-local-offer') {
                    try {
                        await peerInfo.pc.setRemoteDescription(new RTCSessionDescription(answer));
                        await flushPendingCandidates(remoteUserId);
                    } catch (e) {
                        console.error(`Error handling answer from ${remoteUserId}`, e);
                    }
                }
            }

            // Fix #12: Manejar ICE candidate con buffering
            async function handleCandidate(remoteUserId, candidate) {
                const peerInfo = peers.get(remoteUserId);
                if (!peerInfo) return;
                if (!peerInfo.pc.remoteDescription || !peerInfo.pc.remoteDescription.type) {
                    // Buffer the candidate — remote description not set yet
                    peerInfo.pendingCandidates.push(candidate);
                    console.log(`Buffered ICE candidate for ${remoteUserId}`);
                    return;
                }
                try {
                    await peerInfo.pc.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (e) {
                    console.error('Error adding ICE candidate', e);
                }
            }

            // ----- Señalización WebSocket -----
            function connectWebSocket() {
                setConnectionStatus('connecting');
                socket = new WebSocket(WS_URL);
                socket.onopen = () => {
                    console.log('WebSocket connected');
                    socket.send(JSON.stringify({ name: myName, role: myRole }));
                    setConnectionStatus('connected');
                    wsReconnectAttempts = 0;
                    showToast('Conectado al servidor');
                };
                socket.onmessage = async (event) => {
                    const msg = JSON.parse(event.data);
                    switch (msg.type) {
                        case 'existing-users':
                            myUserId = msg.myUserId;
                            amIHost = msg.isHost;
                            hostId = msg.hostId;
                            console.log(`My user ID: ${myUserId}, amIHost: ${amIHost}`);
                            // Fix #6: Store known users, DON'T create peer connections yet
                            for (const user of msg.users) {
                                knownUsers.set(user.userId, {
                                    display: user.display,
                                    isHost: user.isHost,
                                    muted: user.muted
                                });
                            }
                            updateParticipantsCount();
                            break;

                        case 'user-joined':
                            // Track user
                            knownUsers.set(msg.userId, {
                                display: msg.display,
                                isHost: msg.isHost,
                                muted: msg.muted
                            });
                            // If call is active, create peer connection
                            if (callActive && localStream && !peers.has(msg.userId)) {
                                await createPeerConnection(msg.userId, msg.display, true);
                            }
                            addChatMessage('Sistema', `${msg.display} se ha unido a la sala`, true);
                            updateParticipantsCount();
                            break;

                        case 'user-left':
                            knownUsers.delete(msg.userId);
                            if (peers.has(msg.userId)) {
                                peers.get(msg.userId).pc.close();
                                peers.delete(msg.userId);
                                removeVideoElement(msg.userId);
                            }
                            addChatMessage('Sistema', `${msg.username} ha salido de la sala`, true);
                            updateParticipantsCount();
                            break;

                        case 'offer':
                            // Fix #8: Always handle offers (auto-acquires media)
                            await handleOffer(msg.senderId, msg.offer, msg.senderName);
                            break;

                        case 'answer':
                            await handleAnswer(msg.senderId, msg.answer);
                            break;

                        case 'candidate':
                            await handleCandidate(msg.senderId, msg.candidate);
                            break;

                        case 'chat':
                            // Fix #16: Detect system messages
                            if (msg.sender === 'system') {
                                addChatMessage('Sistema', msg.message, true);
                            } else {
                                addChatMessage(msg.senderName || msg.sender, msg.message, false);
                            }
                            break;

                        case 'host-info':
                            hostId = msg.hostId;
                            amIHost = (myUserId === hostId);
                            // Update known users
                            for (const [uid, info] of knownUsers.entries()) {
                                info.isHost = (uid === hostId);
                            }
                            // Update host badges in video cards
                            for (const [uid] of peers.entries()) {
                                const isHostNow = (uid === hostId);
                                const card = document.getElementById(`video-${uid}`);
                                if (card) {
                                    let badge = card.querySelector('.host-badge');
                                    if (isHostNow && !badge) {
                                        const newBadge = document.createElement('div');
                                        newBadge.className = 'host-badge';
                                        newBadge.innerText = 'Anfitrión';
                                        card.appendChild(newBadge);
                                    } else if (!isHostNow && badge) badge.remove();
                                }
                            }
                            if (amIHost) showToast('Ahora eres el anfitrión');
                            break;

                        case 'user-muted':
                            // Update known user state
                            if (knownUsers.has(msg.userId)) {
                                knownUsers.get(msg.userId).muted = msg.muted;
                            }
                            if (peers.has(msg.userId)) {
                                peers.get(msg.userId).muted = msg.muted;
                                const card = document.getElementById(`video-${msg.userId}`);
                                if (card) {
                                    let mutedBadge = card.querySelector('.muted-badge');
                                    if (msg.muted && !mutedBadge) {
                                        const badge = document.createElement('div');
                                        badge.className = 'muted-badge';
                                        badge.innerText = '🔇 Silenciado';
                                        card.appendChild(badge);
                                    } else if (!msg.muted && mutedBadge) mutedBadge.remove();
                                    // Fix #14: Use data attribute to find the mute button
                                    const muteBtn = card.querySelector('.host-action-btn[data-action="mute"]');
                                    if (muteBtn) muteBtn.innerText = msg.muted ? '🔊 Activar' : '🔇 Silenciar';
                                }
                            }
                            // If this is about me, apply the mute
                            if (msg.userId === myUserId && localStream) {
                                const audioTrack = localStream.getAudioTracks()[0];
                                if (audioTrack) {
                                    audioTrack.enabled = !msg.muted;
                                    micEnabled = !msg.muted;
                                    const micBtn = document.getElementById('micBtn');
                                    if (micBtn) micBtn.style.opacity = micEnabled ? '1' : '0.5';
                                    showToast(msg.muted ? 'El anfitrión te ha silenciado' : 'El anfitrión ha activado tu micrófono');
                                }
                            }
                            break;

                        case 'kicked':
                            showToast(msg.reason);
                            if (localStream) {
                                localStream.getTracks().forEach(t => t.stop());
                            }
                            setTimeout(() => window.location.href = '/', 2000);
                            break;
                    }
                };
                socket.onerror = (err) => {
                    console.error('WebSocket error', err);
                    setConnectionStatus('error');
                };
                // Fix #11: Auto-reconnect with backoff
                socket.onclose = (event) => {
                    console.log('WebSocket closed', event.code);
                    setConnectionStatus('error');
                    if (wsReconnectAttempts < MAX_RECONNECT && event.code !== 1000) {
                        wsReconnectAttempts++;
                        const delay = Math.min(1000 * Math.pow(2, wsReconnectAttempts), 15000);
                        showToast(`Reconectando en ${Math.round(delay / 1000)}s...`);
                        setTimeout(connectWebSocket, delay);
                    } else if (wsReconnectAttempts >= MAX_RECONNECT) {
                        showToast('No se pudo reconectar al servidor');
                    }
                };
            }

            // ----- Iniciar/Detener llamada -----
            async function startCall() {
                if (callActive) {
                    showToast('La llamada ya está activa');
                    return;
                }

                // Verificar compatibilidad del navegador
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showMediaError(
                        'Navegador no compatible',
                        'Tu navegador no soporta videollamadas. Usa Chrome, Firefox, Safari o Edge en su versión más reciente.'
                    );
                    return;
                }

                try {
                    console.log('Requesting camera/mic');
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    console.log('Got local stream with video and audio');
                } catch (err) {
                    console.warn('Failed to get video+audio, trying audio only...', err.name);
                    // Fallback: intentar solo audio
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
                        console.log('Got local stream with audio only');
                        camEnabled = false;
                        document.getElementById('camBtn').style.opacity = '0.5';
                        showMediaWarning(
                            'Solo audio disponible',
                            'No se pudo acceder a la cámara. La llamada continuará solo con micrófono.'
                        );
                    } catch (audioErr) {
                        console.error('Failed to get any media', audioErr);
                        handleMediaError(err); // Show original error (more descriptive)
                        return;
                    }
                }

                // Mostrar mi video local
                const { video } = createVideoElement('local', myDisplay, true, amIHost, false);
                video.srcObject = localStream;
                callActive = true;

                // Fix #7: Create peer connections with ALL known users and send offers
                for (const [userId, userInfo] of knownUsers.entries()) {
                    if (!peers.has(userId)) {
                        await createPeerConnection(userId, userInfo.display, true);
                    }
                }
                updateParticipantsCount();
                showToast(camEnabled ? 'Cámara y micrófono activados' : 'Micrófono activado (sin cámara)');
            }

            function hangUp() {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }
                for (const [userId, info] of peers.entries()) {
                    info.pc.close();
                    removeVideoElement(userId);
                }
                peers.clear();
                // Eliminar mi video local
                const localVideoCard = document.getElementById('video-local');
                if (localVideoCard) localVideoCard.remove();
                callActive = false;
                updateParticipantsCount();
                showToast('Llamada finalizada');
            }

            function toggleMic() {
                if (localStream) {
                    const audioTrack = localStream.getAudioTracks()[0];
                    if (audioTrack) {
                        micEnabled = !micEnabled;
                        audioTrack.enabled = micEnabled;
                        const micBtn = document.getElementById('micBtn');
                        if (micBtn) micBtn.style.opacity = micEnabled ? '1' : '0.5';
                        showToast(micEnabled ? 'Micrófono activado' : 'Micrófono silenciado');
                    }
                } else {
                    showToast('Inicia la cámara primero');
                }
            }

            function toggleCam() {
                if (localStream) {
                    const videoTrack = localStream.getVideoTracks()[0];
                    if (videoTrack) {
                        camEnabled = !camEnabled;
                        videoTrack.enabled = camEnabled;
                        const camBtn = document.getElementById('camBtn');
                        if (camBtn) camBtn.style.opacity = camEnabled ? '1' : '0.5';
                        showToast(camEnabled ? 'Cámara activada' : 'Cámara apagada');
                    }
                } else {
                    showToast('Inicia la cámara primero');
                }
            }

            function sendChatMessage() {
                const input = document.getElementById('chatInput');
                const text = input.value.trim();
                if (text === "") return;
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'chat', message: text }));
                    // Fix #5: Show own message immediately
                    addChatMessage(`Tú (${myDisplay})`, text, false);
                    input.value = '';
                } else {
                    showToast('No conectado al servidor');
                }
            }

            // ----- Event listeners -----
            document.getElementById('startCallBtn').addEventListener('click', startCall);
            document.getElementById('hangupBtn').addEventListener('click', hangUp);
            document.getElementById('micBtn').addEventListener('click', toggleMic);
            document.getElementById('camBtn').addEventListener('click', toggleCam);
            document.getElementById('copyBtn').addEventListener('click', () => {
                navigator.clipboard.writeText(roomId);
                showToast('ID de sala copiado');
            });
            document.getElementById('sendChatBtn').addEventListener('click', sendChatMessage);
            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendChatMessage();
            });
            document.getElementById('roomIdDisplay').innerText = roomId;

            // Iniciar conexión WebSocket
            connectWebSocket();
        })();
    </script>
