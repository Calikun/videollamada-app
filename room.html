<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Sala de videollamada en tiempo real con video, audio, chat y QoS adaptativa.">
    <title>Ensigan.corp · Sala {{ROOM_ID}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a10;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Top Bar ── */
        .topbar {
            background: #18181f;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            background: #1c1c26;
            padding: 5px 14px;
            border-radius: 40px;
            font-family: monospace;
        }

        .copy-btn {
            background: #2a2a35;
            border: none;
            color: #fff;
            padding: 5px 10px;
            border-radius: 30px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover { background: #3a3a45; }

        .topbar-center {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .participants-count {
            background: #1c1c26;
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 12px;
        }

        .qos-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(124, 111, 247, 0.1);
            border: 1px solid rgba(124, 111, 247, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            color: #a99ef7;
        }

        .qos-indicator.high { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: #f87171; }
        .qos-indicator.medium { background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.2); color: #fbbf24; }

        .conn-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #8a8a98;
        }

        .conn-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #f59e0b;
            transition: background 0.3s;
        }

        .conn-dot.connected { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.4); }
        .conn-dot.error { background: #ef4444; }

        /* ── Main Container ── */
        .main-container { flex: 1; display: flex; overflow: hidden; }

        .videos-area {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
            padding: 16px;
            overflow-y: auto;
            background: #0f0f13;
        }

        /* ── Video Card ── */
        .video-card {
            background: #1c1c26;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: cardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: border-color 0.3s;
        }

        .video-card:hover { border-color: rgba(124, 111, 247, 0.3); }
        .video-card.qos-high { border-color: rgba(239, 68, 68, 0.25); }
        .video-card.qos-medium { border-color: rgba(245, 158, 11, 0.2); }

        @keyframes cardIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .video-card video { width: 100%; height: 100%; object-fit: cover; }

        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            z-index: 5;
        }

        .stats-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            padding: 5px 8px;
            border-radius: 7px;
            font-size: 9px;
            font-family: monospace;
            color: #4ade80;
            pointer-events: none;
            z-index: 10;
            white-space: pre-line;
            line-height: 1.4;
            display: none;
        }

        .host-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(124, 111, 247, 0.8);
            padding: 2px 7px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 600;
        }

        .qos-card-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 2px 7px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 600;
        }

        .qos-card-badge.high { background: rgba(239, 68, 68, 0.7); }
        .qos-card-badge.medium { background: rgba(245, 158, 11, 0.7); }

        .muted-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 7px;
            border-radius: 20px;
            font-size: 10px;
        }

        .host-action-btn {
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: white;
            padding: 3px 7px;
            border-radius: 14px;
            font-size: 10px;
            cursor: pointer;
            margin-left: 3px;
        }

        /* ── Chat Panel ── */
        .chat-panel {
            width: 270px;
            background: #18181f;
            border-left: 0.5px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .chat-header { padding: 14px; border-bottom: 0.5px solid rgba(255, 255, 255, 0.08); font-weight: 600; font-size: 14px; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-message { font-size: 13px; line-height: 1.4; }
        .chat-message .sender { font-weight: 600; color: #a99ef7; margin-right: 6px; }
        .chat-message.system { color: #8a8a98; font-style: italic; font-size: 11px; text-align: center; }

        .chat-input-area {
            padding: 12px;
            border-top: 0.5px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 6px;
        }

        .chat-input-area input {
            flex: 1;
            background: #1c1c26;
            border: 1px solid #2a2a35;
            border-radius: 20px;
            padding: 9px 12px;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
            outline: none;
        }

        .chat-input-area input:focus { border-color: rgba(124, 111, 247, 0.4); }

        .chat-input-area button {
            background: #7c6ff7;
            border: none;
            border-radius: 20px;
            padding: 0 14px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
            transition: opacity 0.2s;
        }

        .chat-input-area button:hover { opacity: 0.85; }

        /* ── Controls Bar ── */
        .controls-bar {
            background: #18181f;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            border-top: 0.5px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: #2a2a35;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .ctrl-btn:hover { transform: scale(1.05); }
        .ctrl-btn.primary { background: #7c6ff7; }
        .ctrl-btn.danger { background: #c23535; }
        .ctrl-btn.off { opacity: 0.4; }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(42, 42, 53, 0.95);
            backdrop-filter: blur(8px);
            padding: 9px 18px;
            border-radius: 40px;
            font-size: 12px;
            animation: fadeOut 2.5s forwards;
            z-index: 1000;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.06);
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-16px); }
        }

        /* ── Media Error / Warning Banners ── */
        .media-error-banner, .media-warning-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            backdrop-filter: blur(12px);
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2000;
            font-size: 13px;
            animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .media-error-banner {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(185, 28, 28, 0.95));
        }

        .media-warning-banner {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.95), rgba(180, 110, 0, 0.95));
        }

        .media-error-banner .error-content,
        .media-warning-banner .error-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .error-icon { font-size: 18px; }
        .error-text strong { display: block; font-size: 13px; }
        .error-text span { font-size: 11px; opacity: 0.9; }

        .close-error {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .close-error:hover { background: rgba(255, 255, 255, 0.3); }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        /* ── Responsive ── */
        @media (max-width: 800px) {
            .chat-panel { width: 220px; }
            .videos-area { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
        }

        @media (max-width: 600px) {
            .main-container { flex-direction: column; }
            .chat-panel { width: 100%; height: 220px; border-left: none; border-top: 0.5px solid rgba(255, 255, 255, 0.08); }
            .videos-area { order: 1; }
            .chat-panel { order: 2; }
            .topbar { padding: 8px 12px; flex-wrap: wrap; gap: 6px; }
            .qos-indicator { display: none; }
        }
    </style>
</head>

<body>
    <div class="topbar">
        <div class="room-info">
            <span>Sala</span>
            <strong id="roomIdDisplay">{{ROOM_ID}}</strong>
            <button class="copy-btn" id="copyBtn">Copiar ID</button>
        </div>
        <div class="topbar-center">
            <div class="conn-status" id="connStatus">
                <span class="conn-dot" id="connDot"></span>
                <span id="connText">Conectando...</span>
            </div>
            <div class="qos-indicator" id="qosIndicator">● QoS: Normal</div>
        </div>
        <div class="participants-count" id="participantsCount">Participantes: 1</div>
    </div>

    <div class="main-container">
        <div class="videos-area" id="videosGrid"></div>
        <div class="chat-panel">
            <div class="chat-header">Chat de la reunión</div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Escribe un mensaje...">
                <button id="sendChatBtn">Enviar</button>
            </div>
        </div>
    </div>

    <div class="controls-bar">
        <button class="ctrl-btn" id="micBtn" title="Micrófono">🎤</button>
        <button class="ctrl-btn" id="camBtn" title="Cámara">📷</button>
        <button class="ctrl-btn primary" id="startCallBtn" title="Iniciar llamada">📞</button>
        <button class="ctrl-btn danger" id="hangupBtn" title="Colgar">❌</button>
    </div>

    <script>
        (function () {
            // ── Configuration ──
            const roomId = '{{ROOM_ID}}';
            const urlParams = new URLSearchParams(window.location.search);
            let myName = urlParams.get('name') || 'Anónimo';
            let myRole = urlParams.get('role') || '';
            let myQosPriority = parseInt(urlParams.get('qos') || '0');
            let mySessionUserId = urlParams.get('uid') || '';
            const myDisplay = myRole ? `${myName} (${myRole})` : myName;

            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const WS_URL = `${wsProtocol}//${window.location.host}/ws/${roomId}`;

            const ICE_CONFIG = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            };

            // ── Global State ──
            let socket = null;
            let localStream = null;
            let myUserId = null;
            let amIHost = false;
            let hostId = null;
            let callActive = false;
            let micEnabled = true;
            let camEnabled = true;
            let wsReconnectAttempts = 0;
            const MAX_RECONNECT = 5;

            // QoS profiles received from server
            let qosProfiles = {};

            let peers = new Map();
            let knownUsers = new Map();

            // DOM
            const videosGrid = document.getElementById('videosGrid');
            const participantsSpan = document.getElementById('participantsCount');
            const chatMessagesDiv = document.getElementById('chatMessages');
            const connDot = document.getElementById('connDot');
            const connText = document.getElementById('connText');
            const qosIndicator = document.getElementById('qosIndicator');

            // ── Update QoS indicator in topbar ──
            function updateQosIndicator() {
                if (myQosPriority >= 2) {
                    qosIndicator.textContent = '⚡ QoS: Alta';
                    qosIndicator.className = 'qos-indicator high';
                } else if (myQosPriority === 1) {
                    qosIndicator.textContent = '🔶 QoS: Media';
                    qosIndicator.className = 'qos-indicator medium';
                } else {
                    qosIndicator.textContent = '● QoS: Normal';
                    qosIndicator.className = 'qos-indicator';
                }
            }
            updateQosIndicator();

            // ── Helpers ──
            function setConnectionStatus(status) {
                connDot.className = 'conn-dot';
                if (status === 'connected') {
                    connDot.classList.add('connected');
                    connText.textContent = 'Conectado';
                } else if (status === 'error') {
                    connDot.classList.add('error');
                    connText.textContent = 'Desconectado';
                } else {
                    connText.textContent = 'Conectando...';
                }
            }

            function showToast(msg) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerText = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2500);
            }

            function updateParticipantsCount() {
                const count = 1 + knownUsers.size;
                participantsSpan.innerText = `Participantes: ${count}`;
            }

            function addChatMessage(sender, message, isSystem = false) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'chat-message';
                if (isSystem) {
                    msgDiv.classList.add('system');
                    msgDiv.innerText = message;
                } else {
                    msgDiv.innerHTML = `<span class="sender">${escapeHtml(sender)}</span><span>${escapeHtml(message)}</span>`;
                }
                chatMessagesDiv.appendChild(msgDiv);
                msgDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, m => {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            // ── Apply QoS to a peer connection sender ──
            async function applyQoS(pc, priority) {
                const profile = qosProfiles[String(priority)] || qosProfiles['0'];
                if (!profile) return;

                try {
                    const senders = pc.getSenders();
                    for (const sender of senders) {
                        if (sender.track && sender.track.kind === 'video') {
                            const params = sender.getParameters();
                            if (!params.encodings || params.encodings.length === 0) {
                                params.encodings = [{}];
                            }
                            params.encodings[0].maxBitrate = profile.maxBitrate;
                            params.encodings[0].maxFramerate = profile.maxFramerate;
                            if (profile.scaleResolutionDownBy > 1) {
                                params.encodings[0].scaleResolutionDownBy = profile.scaleResolutionDownBy;
                            }
                            // Set priority if browser supports it
                            try {
                                params.encodings[0].priority = profile.priority;
                                params.encodings[0].networkPriority = profile.networkPriority;
                            } catch (e) { /* browser may not support */ }

                            await sender.setParameters(params);
                            console.log(`[QoS] Applied profile ${priority} to sender: bitrate=${profile.maxBitrate}, fps=${profile.maxFramerate}`);
                        }
                    }
                } catch (e) {
                    console.warn('[QoS] Error applying QoS parameters:', e);
                }
            }

            // ── Create Video Element ──
            function createVideoElement(userId, displayName, isLocal = false, isHost = false, isMuted = false, userQos = 0) {
                const container = document.createElement('div');
                container.className = 'video-card';
                container.id = `video-${userId}`;

                if (userQos >= 2) container.classList.add('qos-high');
                else if (userQos === 1) container.classList.add('qos-medium');

                const video = document.createElement('video');
                video.autoplay = true;
                video.playsInline = true;
                if (isLocal) video.muted = true;

                const label = document.createElement('div');
                label.className = 'video-label';
                label.innerText = isLocal ? `Tú (${displayName})` : displayName;

                container.appendChild(video);
                container.appendChild(label);

                // Stats overlay
                const statsOverlay = document.createElement('div');
                statsOverlay.className = 'stats-overlay';
                statsOverlay.id = `stats-${userId}`;
                container.appendChild(statsOverlay);

                // Host badge
                if (isHost && !isLocal) {
                    const badge = document.createElement('div');
                    badge.className = 'host-badge';
                    badge.innerText = 'Anfitrión';
                    container.appendChild(badge);
                }

                // QoS badge for high priority users
                if (userQos >= 2 && !isLocal) {
                    const qBadge = document.createElement('div');
                    qBadge.className = 'qos-card-badge high';
                    qBadge.innerText = '⚡ Alta prioridad';
                    container.appendChild(qBadge);
                } else if (userQos === 1 && !isLocal) {
                    const qBadge = document.createElement('div');
                    qBadge.className = 'qos-card-badge medium';
                    qBadge.innerText = '🔶 Prioridad media';
                    container.appendChild(qBadge);
                }

                // Muted badge
                if (isMuted && !isLocal) {
                    const badge = document.createElement('div');
                    badge.className = 'muted-badge';
                    badge.innerText = '🔇 Silenciado';
                    container.appendChild(badge);
                }

                // Host controls
                if (amIHost && !isLocal) {
                    const controlsDiv = document.createElement('div');
                    controlsDiv.style.cssText = 'position:absolute;bottom:10px;right:10px;display:flex;gap:4px;';
                    const muteBtn = document.createElement('button');
                    muteBtn.className = 'host-action-btn';
                    muteBtn.setAttribute('data-action', 'mute');
                    muteBtn.innerText = isMuted ? '🔊 Activar' : '🔇 Silenciar';
                    muteBtn.onclick = (e) => {
                        e.stopPropagation();
                        socket.send(JSON.stringify({ type: 'host-mute', targetId: userId, mute: !isMuted }));
                    };
                    const kickBtn = document.createElement('button');
                    kickBtn.className = 'host-action-btn';
                    kickBtn.innerText = '🚫';
                    kickBtn.title = 'Expulsar';
                    kickBtn.onclick = (e) => {
                        e.stopPropagation();
                        if (confirm(`¿Expulsar a ${displayName}?`)) {
                            socket.send(JSON.stringify({ type: 'host-kick', targetId: userId }));
                        }
                    };
                    controlsDiv.appendChild(muteBtn);
                    controlsDiv.appendChild(kickBtn);
                    container.appendChild(controlsDiv);
                }

                videosGrid.appendChild(container);
                return { container, video };
            }

            function removeVideoElement(userId) {
                const el = document.getElementById(`video-${userId}`);
                if (el) el.remove();
            }

            // ── WebRTC: Create Peer Connection ──
            async function createPeerConnection(remoteUserId, remoteDisplay, isInitiator = true) {
                if (peers.has(remoteUserId)) {
                    console.log(`Peer ${remoteUserId} already exists`);
                    return peers.get(remoteUserId).pc;
                }

                console.log(`Creating peer for ${remoteUserId}, initiator=${isInitiator}`);
                const pc = new RTCPeerConnection(ICE_CONFIG);

                const userInfo = knownUsers.get(remoteUserId) || {};
                const peerInfo = {
                    pc,
                    display: remoteDisplay,
                    isHost: userInfo.isHost || false,
                    muted: userInfo.muted || false,
                    qos_priority: userInfo.qos_priority || 0,
                    videoElement: null,
                    pendingCandidates: []
                };
                peers.set(remoteUserId, peerInfo);

                if (localStream) {
                    localStream.getTracks().forEach(track => {
                        pc.addTrack(track, localStream);
                    });
                }

                pc.ontrack = (event) => {
                    console.log(`Got remote track from ${remoteUserId}, kind=${event.track.kind}`);
                    let info = peers.get(remoteUserId);
                    if (!info) return;
                    if (!info.videoElement) {
                        const { video } = createVideoElement(remoteUserId, info.display, false, info.isHost, info.muted, info.qos_priority);
                        info.videoElement = video;
                    }
                    if (info.videoElement.srcObject !== event.streams[0]) {
                        info.videoElement.srcObject = event.streams[0];
                    }
                };

                pc.onicecandidate = (event) => {
                    if (event.candidate && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: 'candidate', candidate: event.candidate, target: remoteUserId }));
                    }
                };

                pc.oniceconnectionstatechange = () => {
                    console.log(`ICE state for ${remoteUserId}: ${pc.iceConnectionState}`);
                    if (pc.iceConnectionState === 'connected') {
                        // Apply QoS once connected
                        applyQoS(pc, myQosPriority);
                    }
                    if (pc.iceConnectionState === 'failed') {
                        if (peers.has(remoteUserId)) {
                            peers.get(remoteUserId).pc.close();
                            peers.delete(remoteUserId);
                            removeVideoElement(remoteUserId);
                            updateParticipantsCount();
                            showToast(`Conexión perdida con ${remoteDisplay}`);
                        }
                    }
                };

                if (isInitiator && localStream) {
                    try {
                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        socket.send(JSON.stringify({ type: 'offer', offer, target: remoteUserId }));
                        console.log(`Sent offer to ${remoteUserId}`);
                    } catch (e) {
                        console.error(`Error creating offer for ${remoteUserId}`, e);
                    }
                }

                updateParticipantsCount();
                return pc;
            }

            // ── Auto-acquire media ──
            async function ensureLocalStream() {
                if (localStream) return true;
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        showMediaError('Navegador no compatible', 'Tu navegador no soporta videollamadas. Usa Chrome, Firefox, Safari o Edge actualizado.');
                        return false;
                    }
                    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                        showMediaWarning('Conexión no segura', 'La cámara y micrófono requieren HTTPS.');
                    }
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    const { video } = createVideoElement('local', myDisplay, true, amIHost, false, myQosPriority);
                    video.srcObject = localStream;
                    callActive = true;
                    showToast('Cámara y micrófono activados');
                    return true;
                } catch (err) {
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
                        const { video } = createVideoElement('local', myDisplay, true, amIHost, false, myQosPriority);
                        video.srcObject = localStream;
                        callActive = true;
                        camEnabled = false;
                        document.getElementById('camBtn').classList.add('off');
                        showMediaWarning('Solo audio disponible', 'No se pudo acceder a la cámara.');
                        return true;
                    } catch (audioErr) {
                        handleMediaError(err);
                        return false;
                    }
                }
            }

            // ── Media Error Handling ──
            function handleMediaError(err) {
                console.error('Media error:', err.name, err.message);
                const errors = {
                    'NotAllowedError': ['Permisos denegados', 'Permite el acceso a cámara y micrófono desde la barra de direcciones.'],
                    'PermissionDeniedError': ['Permisos denegados', 'Permite el acceso a cámara y micrófono desde la barra de direcciones.'],
                    'NotFoundError': ['Dispositivo no encontrado', 'No se encontró cámara ni micrófono. Verifica que estén conectados.'],
                    'DevicesNotFoundError': ['Dispositivo no encontrado', 'No se encontró cámara ni micrófono.'],
                    'NotReadableError': ['Dispositivo ocupado', 'La cámara o micrófono están siendo usados por otra aplicación.'],
                    'TrackStartError': ['Dispositivo ocupado', 'La cámara o micrófono están siendo usados por otra aplicación.'],
                    'OverconstrainedError': ['Configuración no soportada', 'Tu cámara no soporta la configuración solicitada.'],
                };
                const [title, detail] = errors[err.name] || ['Error de dispositivo', `No se pudo acceder: ${err.message || 'Error desconocido'}`];
                showMediaError(title, detail);
            }

            function showMediaError(title, detail) {
                document.querySelectorAll('.media-error-banner, .media-warning-banner').forEach(b => b.remove());
                const banner = document.createElement('div');
                banner.className = 'media-error-banner';
                banner.innerHTML = `<div class="error-content"><span class="error-icon">🚫</span><div class="error-text"><strong>${title}</strong><span>${detail}</span></div></div><button class="close-error" onclick="this.parentElement.remove()">Entendido</button>`;
                document.body.prepend(banner);
            }

            function showMediaWarning(title, detail) {
                document.querySelectorAll('.media-warning-banner').forEach(b => b.remove());
                const banner = document.createElement('div');
                banner.className = 'media-warning-banner';
                banner.innerHTML = `<div class="error-content"><span class="error-icon">⚠️</span><div class="error-text"><strong>${title}</strong><span>${detail}</span></div></div><button class="close-error" onclick="this.parentElement.remove()">OK</button>`;
                document.body.prepend(banner);
                setTimeout(() => { if (banner.parentElement) banner.remove(); }, 8000);
            }

            // ── ICE Candidate buffering ──
            async function flushPendingCandidates(remoteUserId) {
                const peerInfo = peers.get(remoteUserId);
                if (!peerInfo || !peerInfo.pendingCandidates.length) return;
                for (const candidate of peerInfo.pendingCandidates) {
                    try {
                        await peerInfo.pc.addIceCandidate(new RTCIceCandidate(candidate));
                    } catch (e) {
                        console.error('Error adding buffered ICE candidate', e);
                    }
                }
                peerInfo.pendingCandidates = [];
            }

            // ── Handle Offer ──
            async function handleOffer(remoteUserId, offer, senderName) {
                const hasMedia = await ensureLocalStream();
                let peerInfo = peers.get(remoteUserId);
                if (!peerInfo) {
                    await createPeerConnection(remoteUserId, senderName || `Usuario ${remoteUserId.substring(0, 6)}`, false);
                    peerInfo = peers.get(remoteUserId);
                }
                if (hasMedia && localStream) {
                    const senders = peerInfo.pc.getSenders();
                    if (senders.length === 0) {
                        localStream.getTracks().forEach(track => peerInfo.pc.addTrack(track, localStream));
                    }
                }
                const pc = peerInfo.pc;
                try {
                    if (pc.signalingState === 'stable' || pc.signalingState === 'have-local-offer') {
                        if (pc.signalingState === 'have-local-offer') {
                            if (myUserId > remoteUserId) {
                                await pc.setLocalDescription({ type: 'rollback' });
                            } else {
                                return;
                            }
                        }
                        await pc.setRemoteDescription(new RTCSessionDescription(offer));
                        await flushPendingCandidates(remoteUserId);
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        socket.send(JSON.stringify({ type: 'answer', answer, target: remoteUserId }));
                    }
                } catch (e) {
                    console.error(`Error handling offer from ${remoteUserId}`, e);
                }
            }

            async function handleAnswer(remoteUserId, answer) {
                const peerInfo = peers.get(remoteUserId);
                if (peerInfo && peerInfo.pc.signalingState === 'have-local-offer') {
                    try {
                        await peerInfo.pc.setRemoteDescription(new RTCSessionDescription(answer));
                        await flushPendingCandidates(remoteUserId);
                    } catch (e) {
                        console.error(`Error handling answer from ${remoteUserId}`, e);
                    }
                }
            }

            async function handleCandidate(remoteUserId, candidate) {
                const peerInfo = peers.get(remoteUserId);
                if (!peerInfo) return;
                if (!peerInfo.pc.remoteDescription || !peerInfo.pc.remoteDescription.type) {
                    peerInfo.pendingCandidates.push(candidate);
                    return;
                }
                try {
                    await peerInfo.pc.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (e) {
                    console.error('Error adding ICE candidate', e);
                }
            }

            // ── WebSocket ──
            function connectWebSocket() {
                setConnectionStatus('connecting');
                socket = new WebSocket(WS_URL);

                socket.onopen = () => {
                    socket.send(JSON.stringify({
                        name: myName,
                        role: myRole,
                        qos_priority: myQosPriority,
                        session_user_id: mySessionUserId || null
                    }));
                    setConnectionStatus('connected');
                    wsReconnectAttempts = 0;
                    showToast('Conectado al servidor');
                };

                socket.onmessage = async (event) => {
                    const msg = JSON.parse(event.data);

                    switch (msg.type) {
                        case 'existing-users':
                            myUserId = msg.myUserId;
                            amIHost = msg.isHost;
                            hostId = msg.hostId;
                            if (msg.myQosPriority !== undefined) {
                                myQosPriority = msg.myQosPriority;
                                updateQosIndicator();
                            }
                            if (msg.qosProfiles) {
                                qosProfiles = msg.qosProfiles;
                            }
                            for (const user of msg.users) {
                                knownUsers.set(user.userId, {
                                    display: user.display,
                                    isHost: user.isHost,
                                    muted: user.muted,
                                    qos_priority: user.qos_priority || 0
                                });
                            }
                            updateParticipantsCount();
                            break;

                        case 'user-joined':
                            knownUsers.set(msg.userId, {
                                display: msg.display,
                                isHost: msg.isHost,
                                muted: msg.muted,
                                qos_priority: msg.qos_priority || 0
                            });
                            if (callActive && localStream && !peers.has(msg.userId)) {
                                await createPeerConnection(msg.userId, msg.display, true);
                            }
                            addChatMessage('Sistema', `${msg.display} se ha unido`, true);
                            updateParticipantsCount();
                            break;

                        case 'user-left':
                            knownUsers.delete(msg.userId);
                            if (peers.has(msg.userId)) {
                                peers.get(msg.userId).pc.close();
                                peers.delete(msg.userId);
                                removeVideoElement(msg.userId);
                            }
                            addChatMessage('Sistema', `${msg.username} ha salido`, true);
                            updateParticipantsCount();
                            break;

                        case 'offer':
                            await handleOffer(msg.senderId, msg.offer, msg.senderName);
                            break;

                        case 'answer':
                            await handleAnswer(msg.senderId, msg.answer);
                            break;

                        case 'candidate':
                            await handleCandidate(msg.senderId, msg.candidate);
                            break;

                        case 'chat':
                            if (msg.sender === 'system') {
                                addChatMessage('Sistema', msg.message, true);
                            } else {
                                addChatMessage(msg.senderName || msg.sender, msg.message, false);
                            }
                            break;

                        case 'host-info':
                            hostId = msg.hostId;
                            amIHost = (myUserId === hostId);
                            for (const [uid, info] of knownUsers.entries()) {
                                info.isHost = (uid === hostId);
                            }
                            if (amIHost) showToast('Ahora eres el anfitrión');
                            break;

                        case 'user-muted':
                            if (knownUsers.has(msg.userId)) knownUsers.get(msg.userId).muted = msg.muted;
                            if (peers.has(msg.userId)) {
                                peers.get(msg.userId).muted = msg.muted;
                                const card = document.getElementById(`video-${msg.userId}`);
                                if (card) {
                                    let mutedBadge = card.querySelector('.muted-badge');
                                    if (msg.muted && !mutedBadge) {
                                        const badge = document.createElement('div');
                                        badge.className = 'muted-badge';
                                        badge.innerText = '🔇 Silenciado';
                                        card.appendChild(badge);
                                    } else if (!msg.muted && mutedBadge) mutedBadge.remove();
                                    const muteBtn = card.querySelector('.host-action-btn[data-action="mute"]');
                                    if (muteBtn) muteBtn.innerText = msg.muted ? '🔊 Activar' : '🔇 Silenciar';
                                }
                            }
                            if (msg.userId === myUserId && localStream) {
                                const audioTrack = localStream.getAudioTracks()[0];
                                if (audioTrack) {
                                    audioTrack.enabled = !msg.muted;
                                    micEnabled = !msg.muted;
                                    document.getElementById('micBtn').classList.toggle('off', !micEnabled);
                                    showToast(msg.muted ? 'El anfitrión te ha silenciado' : 'El anfitrión activó tu micrófono');
                                }
                            }
                            break;

                        case 'kicked':
                            showToast(msg.reason);
                            if (localStream) localStream.getTracks().forEach(t => t.stop());
                            setTimeout(() => window.location.href = '/', 2000);
                            break;

                        case 'error':
                            showToast(msg.message || 'Error del servidor');
                            break;
                    }
                };

                socket.onerror = () => setConnectionStatus('error');

                socket.onclose = (event) => {
                    setConnectionStatus('error');
                    if (wsReconnectAttempts < MAX_RECONNECT && event.code !== 1000) {
                        wsReconnectAttempts++;
                        const delay = Math.min(1000 * Math.pow(2, wsReconnectAttempts), 15000);
                        showToast(`Reconectando en ${Math.round(delay / 1000)}s...`);
                        setTimeout(connectWebSocket, delay);
                    } else if (wsReconnectAttempts >= MAX_RECONNECT) {
                        showToast('No se pudo reconectar al servidor');
                    }
                };
            }

            // ── Start / Stop Call ──
            async function startCall() {
                if (callActive) { showToast('La llamada ya está activa'); return; }
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showMediaError('Navegador no compatible', 'Tu navegador no soporta videollamadas.');
                    return;
                }
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                } catch (err) {
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
                        camEnabled = false;
                        document.getElementById('camBtn').classList.add('off');
                        showMediaWarning('Solo audio disponible', 'La llamada continuará solo con micrófono.');
                    } catch (audioErr) {
                        handleMediaError(err);
                        return;
                    }
                }

                const { video } = createVideoElement('local', myDisplay, true, amIHost, false, myQosPriority);
                video.srcObject = localStream;
                callActive = true;

                for (const [userId, userInfo] of knownUsers.entries()) {
                    if (!peers.has(userId)) {
                        await createPeerConnection(userId, userInfo.display, true);
                    }
                }
                updateParticipantsCount();
                showToast(camEnabled ? 'Cámara y micrófono activados' : 'Micrófono activado');
            }

            function hangUp() {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }
                for (const [userId, info] of peers.entries()) {
                    info.pc.close();
                    removeVideoElement(userId);
                }
                peers.clear();
                const localCard = document.getElementById('video-local');
                if (localCard) localCard.remove();
                callActive = false;
                micEnabled = true;
                camEnabled = true;
                document.getElementById('micBtn').classList.remove('off');
                document.getElementById('camBtn').classList.remove('off');
                updateParticipantsCount();
                showToast('Llamada finalizada');
            }

            function toggleMic() {
                if (localStream) {
                    const t = localStream.getAudioTracks()[0];
                    if (t) {
                        micEnabled = !micEnabled;
                        t.enabled = micEnabled;
                        document.getElementById('micBtn').classList.toggle('off', !micEnabled);
                        showToast(micEnabled ? 'Micrófono activado' : 'Micrófono silenciado');
                    }
                } else {
                    showToast('Inicia la llamada primero');
                }
            }

            function toggleCam() {
                if (localStream) {
                    const t = localStream.getVideoTracks()[0];
                    if (t) {
                        camEnabled = !camEnabled;
                        t.enabled = camEnabled;
                        document.getElementById('camBtn').classList.toggle('off', !camEnabled);
                        showToast(camEnabled ? 'Cámara activada' : 'Cámara apagada');
                    }
                } else {
                    showToast('Inicia la llamada primero');
                }
            }

            function sendChatMessage() {
                const input = document.getElementById('chatInput');
                const text = input.value.trim();
                if (!text) return;
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'chat', message: text }));
                    addChatMessage(`Tú (${myDisplay})`, text, false);
                    input.value = '';
                } else {
                    showToast('No conectado al servidor');
                }
            }

            // ── Event Listeners ──
            document.getElementById('startCallBtn').addEventListener('click', startCall);
            document.getElementById('hangupBtn').addEventListener('click', hangUp);
            document.getElementById('micBtn').addEventListener('click', toggleMic);
            document.getElementById('camBtn').addEventListener('click', toggleCam);
            document.getElementById('copyBtn').addEventListener('click', () => {
                navigator.clipboard.writeText(roomId);
                showToast('ID de sala copiado');
            });
            document.getElementById('sendChatBtn').addEventListener('click', sendChatMessage);
            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendChatMessage();
            });
            document.getElementById('roomIdDisplay').innerText = roomId;

            // ── WebRTC Stats Monitor (QoS) ──
            const lastStats = new Map();

            function startStatsMonitor() {
                setInterval(async () => {
                    const allStats = {};
                    for (const [userId, peerInfo] of peers.entries()) {
                        if (!peerInfo.pc) continue;
                        try {
                            const stats = await peerInfo.pc.getStats(null);
                            let rtt = 0, bytesReceived = 0, packetsLost = 0, jitter = 0, frameRate = 0, resolution = '';

                            stats.forEach(report => {
                                if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                                    rtt = (report.currentRoundTripTime * 1000) || 0;
                                }
                                if (report.type === 'inbound-rtp' && report.kind === 'video') {
                                    bytesReceived = report.bytesReceived;
                                    packetsLost = report.packetsLost;
                                    jitter = (report.jitter * 1000) || 0;
                                    frameRate = report.framesPerSecond || 0;
                                    if (report.frameWidth) resolution = `${report.frameWidth}x${report.frameHeight}`;
                                }
                            });

                            let bitrate = 0;
                            const now = performance.now();
                            const last = lastStats.get(userId);
                            if (last) {
                                const timeDiff = (now - last.time) / 1000;
                                const bytesDiff = bytesReceived - last.bytesReceived;
                                if (bytesDiff > 0 && timeDiff > 0) bitrate = (bytesDiff * 8 / timeDiff) / 1000;
                            }
                            lastStats.set(userId, { time: now, bytesReceived });

                            // Adaptive QoS: if network is degraded, reduce non-priority users
                            if (rtt > 200 || packetsLost > 50) {
                                const remotePriority = peerInfo.qos_priority || 0;
                                if (remotePriority < 2) {
                                    // Reduce quality for non-priority peers
                                    const degradedProfile = qosProfiles['0'];
                                    if (degradedProfile) {
                                        try {
                                            const senders = peerInfo.pc.getSenders();
                                            for (const sender of senders) {
                                                if (sender.track && sender.track.kind === 'video') {
                                                    const params = sender.getParameters();
                                                    if (params.encodings && params.encodings.length > 0) {
                                                        params.encodings[0].maxBitrate = Math.min(params.encodings[0].maxBitrate || 800000, 500000);
                                                        await sender.setParameters(params);
                                                    }
                                                }
                                            }
                                        } catch (e) { /* ignore */ }
                                    }
                                }
                            }

                            const statsEl = document.getElementById(`stats-${userId}`);
                            if (statsEl && rtt > 0) {
                                statsEl.style.display = 'block';
                                const qLabel = peerInfo.qos_priority >= 2 ? '⚡ALTA' : peerInfo.qos_priority === 1 ? '🔶MED' : '●NRM';
                                statsEl.innerText = `QoS: ${qLabel}\nRTT: ${rtt.toFixed(0)} ms\nBitrate: ${bitrate.toFixed(0)} kbps\nLoss: ${packetsLost} pkts\nJitter: ${jitter.toFixed(0)} ms\nRes: ${resolution} @${frameRate}fps`;
                            }

                            // Acumular estadísticas para enviar al servidor
                            if (rtt > 0 || bitrate > 0) {
                                allStats[userId] = { rtt, bitrate, packetsLost, jitter };
                            }
                        } catch (e) {
                            console.error('Stats error for', userId, e);
                        }
                    }

                    // Enviar estadísticas al servidor para Prometheus
                    if (Object.keys(allStats).length > 0 && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: 'webrtc-stats', stats: allStats }));
                    }
                }, 2000);
            }

            // ── Device change detection ──
            if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
                navigator.mediaDevices.addEventListener('devicechange', () => {
                    console.log('[Media] Device change detected');
                    if (callActive) {
                        showToast('Dispositivo de medios cambiado');
                    }
                });
            }

            startStatsMonitor();
            connectWebSocket();
        })();
    </script>
</body>

</html>
